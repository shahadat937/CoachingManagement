# Local infrastructure + all services.  Run from this folder:  docker compose up --build
x-jwt-environment: &jwt-environment
  Jwt__Issuer: "${JWT_ISSUER:-CoachingManagement}"
  Jwt__Audience: "${JWT_AUDIENCE:-CoachingManagement.Web}"
  Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/.env before running Docker Compose}"
  Jwt__AccessTokenLifetimeMinutes: "${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}"

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data", "./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  gateway:
    build: { context: .., dockerfile: src/ApiGateway/Dockerfile }
    ports: ["5000:8080"]
    depends_on: [identity-api, academic-api, students-api, attendance-api, devices-api, accounts-api, exams-api]
  identity-api:
    build: { context: .., dockerfile: src/Services/Identity/Identity.Api/Dockerfile }
    environment:
      <<: *jwt-environment
      ConnectionStrings__Default: Host=postgres;Database=identity_db;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BootstrapAdmin__FullName: "${BOOTSTRAP_ADMIN_FULL_NAME:-}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
  academic-api:
    build: { context: .., dockerfile: src/Services/Academic/Academic.Api/Dockerfile }
    environment:
      <<: *jwt-environment
      ConnectionStrings__Default: Host=postgres;Database=academic_db;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
  students-api:
    build: { context: .., dockerfile: src/Services/Students/Students.Api/Dockerfile }
    environment:
      <<: *jwt-environment
      ConnectionStrings__Default: Host=postgres;Database=students_db;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
  attendance-api:
    build: { context: .., dockerfile: src/Services/Attendance/Attendance.Api/Dockerfile }
    environment:
      <<: *jwt-environment
      ConnectionStrings__Default: Host=postgres;Database=attendance_db;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
  devices-api:
    build: { context: .., dockerfile: src/Services/Devices/Devices.Api/Dockerfile }
    environment:
      <<: *jwt-environment
      ConnectionStrings__Mongo: mongodb://mongo:27017
      RabbitMq__Host: rabbitmq
    depends_on: [mongo, rabbitmq]
  accounts-api:
    build: { context: .., dockerfile: src/Services/Accounts/Accounts.Api/Dockerfile }
    environment:
      <<: *jwt-environment
      ConnectionStrings__Default: Host=postgres;Database=accounts_db;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
  exams-api:
    build: { context: .., dockerfile: src/Services/Exams/Exams.Api/Dockerfile }
    environment:
      <<: *jwt-environment
      ConnectionStrings__Default: Host=postgres;Database=exams_db;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
volumes:
  pg_data:
  mongo_data:
